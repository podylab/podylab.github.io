<body>
<main class="wrap">
  <div class="page-head">
    <img src="media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>Сообщить о проблеме</h1><p class="lead">Ошибка, идея или вопрос. Мы читаем каждое сообщение.</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="Спасибо, получили!">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="Что случилось">
          <label><input type="radio" name="kind" value="bug" checked /><span>Ошибка</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>Идея</span></label>
          <label><input type="radio" name="kind" value="other" /><span>Другое</span></label>
        </div>
        <div class="row2">
          <label>Программа <select name="app"><option>PoDee</option><option>PoDoo</option><option>Сайт</option></select></label>
          <label>Версия и Windows, если знаете <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>Что произошло <textarea name="message" required maxlength="2000" placeholder="Например: после сна компьютера остров пропадает, помогает только перезапуск PoDee." data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> знаков осталось</p>
        <label>Почта для ответа, если хотите <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">Отправить</button><span class="sent"></span></div>
      </form>
      <p class="note">Мы видим только то, что вы написали в форме. <a href="privacy.html">Приватность</a></p>
    </div>
  </section>
</main>
