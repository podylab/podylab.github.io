<body>
<main class="wrap">
  <div class="page-head">
    <img src="../media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>Sorun bildir</h1><p class="lead">Hata, fikir ya da soru. Her mesajı okuyoruz.</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="Teşekkürler, aldık.">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="Ne oldu">
          <label><input type="radio" name="kind" value="bug" checked /><span>Hata</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>Fikir</span></label>
          <label><input type="radio" name="kind" value="other" /><span>Diğer</span></label>
        </div>
        <div class="row2">
          <label>Uygulama <select name="app"><option>PoDee</option><option>PoDoo</option><option>Site</option></select></label>
          <label>Sürüm ve Windows, biliyorsan <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>Ne oldu <textarea name="message" required maxlength="2000" placeholder="Örneğin: bilgisayar uykudan çıkınca ada kayboluyor, yalnızca PoDee’yi yeniden başlatmak işe yarıyor." data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> karakter kaldı</p>
        <label>Yanıt için e-posta, istersen <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">Gönder</button><span class="sent"></span></div>
      </form>
      <p class="note">Yalnızca formda yazdıklarını görürüz. <a href="privacy.html">Gizlilik</a></p>
    </div>
  </section>
</main>
