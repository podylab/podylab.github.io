<body>
<main class="wrap">
  <div class="page-head">
    <img src="../media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>Báo lỗi</h1><p class="lead">Lỗi, ý tưởng hoặc câu hỏi. Mọi tin nhắn đều được đọc.</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="Cảm ơn, chúng tôi đã nhận được.">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="Chuyện gì xảy ra">
          <label><input type="radio" name="kind" value="bug" checked /><span>Lỗi</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>Ý tưởng</span></label>
          <label><input type="radio" name="kind" value="other" /><span>Khác</span></label>
        </div>
        <div class="row2">
          <label>Ứng dụng <select name="app"><option>PoDee</option><option>PoDoo</option><option>Trang web</option></select></label>
          <label>Phiên bản và Windows, nếu bạn biết <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>Chuyện gì đã xảy ra <textarea name="message" required maxlength="2000" placeholder="Ví dụ: sau khi máy tỉnh dậy từ chế độ ngủ, đảo biến mất, chỉ khởi động lại PoDee mới được." data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> ký tự còn lại</p>
        <label>Email để trả lời, nếu bạn muốn <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">Gửi</button><span class="sent"></span></div>
      </form>
      <p class="note">Chúng tôi chỉ thấy những gì bạn viết trong biểu mẫu. <a href="privacy.html">Quyền riêng tư</a></p>
    </div>
  </section>
</main>
