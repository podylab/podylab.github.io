<title>Report a problem</title>
<meta name="description" content="Found a bug in PoDee or PoDoo, or have an idea? Write to us, we read every message." />
<link rel="icon" href="../../media/podee-icon.svg?v=41ecf9f3" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
<main class="wrap">
  <div class="page-head">
    <img src="../../media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>Report a problem</h1><p class="lead">A bug, an idea or a question. We read every message.</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="Thanks, got it!">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="What happened">
          <label><input type="radio" name="kind" value="bug" checked /><span>Bug</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>Idea</span></label>
          <label><input type="radio" name="kind" value="other" /><span>Other</span></label>
        </div>
        <div class="row2">
          <label>App <select name="app"><option>PoDee</option><option>PoDoo</option><option>Website</option></select></label>
          <label>Version and Windows, if you know <input name="version" placeholder="1.3.5, Windows 11" maxlength="80" /></label>
        </div>
        <label>What happened <textarea name="message" required maxlength="2000" placeholder="For example: after the PC wakes up, the island is gone until I restart PoDee." data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> characters left</p>
        <label>Email for a reply, if you like <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">Send</button><span class="sent"></span></div>
      </form>
      <p class="note">We see only what you write in the form. <a href="privacy.html">Privacy</a></p>
    </div>
  </section>
</main>
