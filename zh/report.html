<body>
<main class="wrap">
  <div class="page-head">
    <img src="../media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>报告问题</h1><p class="lead">问题、想法或疑问。每条消息我们都会读。</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="谢谢，收到了。">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="发生了什么">
          <label><input type="radio" name="kind" value="bug" checked /><span>问题</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>想法</span></label>
          <label><input type="radio" name="kind" value="other" /><span>其他</span></label>
        </div>
        <div class="row2">
          <label>应用 <select name="app"><option>PoDee</option><option>PoDoo</option><option>网站</option></select></label>
          <label>版本和 Windows（如果知道） <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>具体情况 <textarea name="message" required maxlength="2000" placeholder="例如：电脑从睡眠中唤醒后小岛消失，只有重启 PoDee 才能恢复。" data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> 字可输入</p>
        <label>用于回复的邮箱（可选） <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">发送</button><span class="sent"></span></div>
      </form>
      <p class="note">我们只能看到你在表单里写的内容。 <a href="privacy.html">隐私</a></p>
    </div>
  </section>
</main>
