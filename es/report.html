<body>
<main class="wrap">
  <div class="page-head">
    <img src="../media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>Informar de un problema</h1><p class="lead">Un error, una idea o una pregunta. Leemos todos los mensajes.</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="Gracias, recibido.">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="Qué pasa">
          <label><input type="radio" name="kind" value="bug" checked /><span>Error</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>Idea</span></label>
          <label><input type="radio" name="kind" value="other" /><span>Otro</span></label>
        </div>
        <div class="row2">
          <label>App <select name="app"><option>PoDee</option><option>PoDoo</option><option>Sitio web</option></select></label>
          <label>Versión y Windows, si lo sabes <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>Qué ha pasado <textarea name="message" required maxlength="2000" placeholder="Por ejemplo: cuando el PC sale de la suspensión la isla desaparece y solo vuelve si reinicio PoDee." data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> caracteres restantes</p>
        <label>Correo para responderte, si quieres <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">Enviar</button><span class="sent"></span></div>
      </form>
      <p class="note">Solo vemos lo que escribes en el formulario. <a href="privacy.html">Privacidad</a></p>
    </div>
  </section>
</main>
