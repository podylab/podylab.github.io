<body>
<main class="wrap">
  <div class="page-head">
    <img src="../media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>問題を報告</h1><p class="lead">不具合、アイデア、質問など。メッセージはすべて読んでいます。</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="ありがとうございます。受け取りました。">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="内容">
          <label><input type="radio" name="kind" value="bug" checked /><span>不具合</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>アイデア</span></label>
          <label><input type="radio" name="kind" value="other" /><span>その他</span></label>
        </div>
        <div class="row2">
          <label>アプリ <select name="app"><option>PoDee</option><option>PoDoo</option><option>サイト</option></select></label>
          <label>バージョンとWindows（わかれば） <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>起きたこと <textarea name="message" required maxlength="2000" placeholder="例：PCがスリープから復帰するとアイランドが消え、PoDeeを再起動するまで戻りません。" data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> 文字入力できます</p>
        <label>返信用メールアドレス（任意） <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">送信</button><span class="sent"></span></div>
      </form>
      <p class="note">私たちに見えるのは、フォームに書いた内容だけです。 <a href="privacy.html">プライバシー</a></p>
    </div>
  </section>
</main>
