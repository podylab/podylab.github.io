<body>
<main class="wrap">
  <div class="page-head">
    <img src="../media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>समस्या बताएँ</h1><p class="lead">गड़बड़ी, विचार या सवाल। हम हर संदेश पढ़ते हैं।</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="धन्यवाद, मिल गया।">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="क्या हुआ">
          <label><input type="radio" name="kind" value="bug" checked /><span>गड़बड़ी</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>विचार</span></label>
          <label><input type="radio" name="kind" value="other" /><span>अन्य</span></label>
        </div>
        <div class="row2">
          <label>ऐप <select name="app"><option>PoDee</option><option>PoDoo</option><option>वेबसाइट</option></select></label>
          <label>संस्करण और Windows, अगर पता हो <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>क्या हुआ <textarea name="message" required maxlength="2000" placeholder="उदाहरण: कंप्यूटर के स्लीप से जागने पर द्वीप गायब हो जाता है, सिर्फ़ PoDee रीस्टार्ट करने से लौटता है।" data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> अक्षर बाकी</p>
        <label>जवाब के लिए ईमेल, अगर चाहें <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">भेजें</button><span class="sent"></span></div>
      </form>
      <p class="note">हमें सिर्फ़ वही दिखता है जो आप फ़ॉर्म में लिखते हैं। <a href="privacy.html">गोपनीयता</a></p>
    </div>
  </section>
</main>
