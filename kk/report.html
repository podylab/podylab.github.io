<main class="wrap">
  <div class="page-head">
    <img src="../media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>Мәселе туралы хабарлау</h1><p class="lead">Қате, идея немесе сұрақ. Әр хабарламаны оқимыз.</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="Рақмет, алдық!">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="Не болды">
          <label><input type="radio" name="kind" value="bug" checked /><span>Қате</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>Идея</span></label>
          <label><input type="radio" name="kind" value="other" /><span>Басқа</span></label>
        </div>
        <div class="row2">
          <label>Бағдарлама <select name="app"><option>PoDee</option><option>PoDoo</option><option>Сайт</option></select></label>
          <label>Білсеңіз, нұсқа және Windows <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>Не болды <textarea name="message" required maxlength="2000" placeholder="Мысалы: компьютер ұйқысынан кейін арал жоғалады, тек PoDee-ні қайта іске қосу көмектеседі." data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> таңба қалды</p>
        <label>Қаласаңыз, жауапқа пошта <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">Жіберу</button><span class="sent"></span></div>
      </form>
      <p class="note">Біз тек формаға жазғаныңызды көреміз. <a href="privacy.html">Құпиялылық</a></p>
    </div>
  </section>
</main>
