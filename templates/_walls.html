<section id="walls">
    <h2>{{wp.title}}</h2>
    <p class="sub">{{wp.sub}}</p>
    <div class="walls">
      <figure class="wp">
        <div class="wp-pic" style="background-image:url({{up}}media/wallpapers/mint-small.jpg)" aria-hidden="true"><div class="sh notch light"><b data-clock>14:32</b></div><i class="ch char cloud" data-c="cloud" data-t="light"></i></div>
        <figcaption><span><b>{{wp.mint}}</b>{{shape.notch}} · {{shape.glass}} · PoDy</span><a class="btn ghost" href="{{up}}media/wallpapers/mint.jpg" download="PoDee-mint.jpg">{{wp.get}}</a></figcaption>
      </figure>
      <figure class="wp">
        <div class="wp-pic" style="background-image:url({{up}}media/wallpapers/night-small.jpg)" aria-hidden="true"><div class="sh notch"><b data-clock>14:32</b></div><i class="ch char cat" data-c="cat" data-t="dark"></i></div>
        <figcaption><span><b>{{wp.night}}</b>{{shape.notch}} · {{char.cat}}</span><a class="btn ghost" href="{{up}}media/wallpapers/night.jpg" download="PoDee-night.jpg">{{wp.get}}</a></figcaption>
      </figure>
      <figure class="wp">
        <div class="wp-pic" style="background-image:url({{up}}media/wallpapers/sand-small.jpg)" aria-hidden="true"><div class="sh capsule wide"><b data-clock>14:32</b><i class="char cat in" data-c="cat" data-t="inside"></i></div></div>
        <figcaption><span><b>{{wp.sand}}</b>{{shape.capsule}} · {{char.cat}} {{place.inside}}</span><a class="btn ghost" href="{{up}}media/wallpapers/sand.jpg" download="PoDee-sand.jpg">{{wp.get}}</a></figcaption>
      </figure>
      <figure class="wp">
        <div class="wp-pic" style="background-image:url({{up}}media/wallpapers/peach-small.jpg)" aria-hidden="true"><div class="sh capsule"><b data-clock>14:32</b></div><i class="ch char dot" data-c="dot" data-t="dark"></i></div>
        <figcaption><span><b>{{wp.peach}}</b>{{shape.capsule}} · {{char.dot}}</span><a class="btn ghost" href="{{up}}media/wallpapers/peach.jpg" download="PoDee-peach.jpg">{{wp.get}}</a></figcaption>
      </figure>
      <figure class="wp">
        <div class="wp-pic" style="background-image:url({{up}}media/wallpapers/sky-small.jpg)" aria-hidden="true"><div class="sh capsule"><b data-clock>14:32</b></div><i class="ch char dotb" data-c="dotb" data-t="dark"></i></div>
        <figcaption><span><b>{{wp.sky}}</b>{{shape.capsule}} · {{char.dot_hl}}</span><a class="btn ghost" href="{{up}}media/wallpapers/sky.jpg" download="PoDee-sky.jpg">{{wp.get}}</a></figcaption>
      </figure>
      <figure class="wp">
        <div class="wp-pic" style="background-image:url({{up}}media/wallpapers/lavender-small.jpg)" aria-hidden="true"><div class="sh cloud light"><b data-clock>14:32</b></div><i class="ch char blob" data-c="blob" data-t="light"></i></div>
        <figcaption><span><b>{{wp.lavender}}</b>{{shape.cloud}} · {{char.blob}}</span><a class="btn ghost" href="{{up}}media/wallpapers/lavender.jpg" download="PoDee-lavender.jpg">{{wp.get}}</a></figcaption>
      </figure>
      <figure class="wp">
        <div class="wp-pic" style="background-image:url({{up}}media/wallpapers/end-small.jpg)" aria-hidden="true"><div class="sh notch pixel obsidian"><b data-clock>14:32</b></div><i class="ch char shade" data-c="shade" data-t="dark"></i></div>
        <figcaption><span><b>{{wp.end}}</b>{{shape.obsidian}} · {{char.shade}}</span><a class="btn ghost" href="{{up}}media/wallpapers/end.jpg" download="PoDee-end.jpg">{{wp.get}}</a></figcaption>
      </figure>
      <figure class="wp">
        <div class="wp-pic" style="background-image:url({{up}}media/wallpapers/snow-small.jpg)" aria-hidden="true"><div class="sh notch pixel snow"><b data-clock>14:32</b></div><i class="ch char ghast" data-c="ghast" data-t="light"></i></div>
        <figcaption><span><b>{{wp.snow}}</b>{{shape.snow}} · {{char.ghast}}</span><a class="btn ghost" href="{{up}}media/wallpapers/snow.jpg" download="PoDee-snow.jpg">{{wp.get}}</a></figcaption>
      </figure>
      <figure class="wp">
        <div class="wp-pic" style="background-image:url({{up}}media/wallpapers/moss-small.jpg)" aria-hidden="true"><div class="sh notch pixel"><b data-clock>14:32</b></div><i class="ch char square" data-c="square" data-t="dark"></i></div>
        <figcaption><span><b>{{wp.moss}}</b>{{shape.stone}} · {{char.square}}</span><a class="btn ghost" href="{{up}}media/wallpapers/moss.jpg" download="PoDee-moss.jpg">{{wp.get}}</a></figcaption>
      </figure>
    </div>
  </section>
