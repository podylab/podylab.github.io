<main class="wrap">
  <div class="page-head">
    <img src="{{up}}media/podee-icon.svg" alt="" />
    <div><h1>{{report.title}}</h1><p class="lead">{{report.lead}}</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="{{report.thanks}}">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="{{report.kind}}">
          <label><input type="radio" name="kind" value="bug" checked /><span>{{report.bug}}</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>{{report.idea}}</span></label>
          <label><input type="radio" name="kind" value="other" /><span>{{report.other}}</span></label>
        </div>
        <div class="row2">
          <label>{{support.app}} <select name="app"><option>PoDee</option><option>PoDoo</option><option>{{report.site}}</option></select></label>
          <label>{{report.version}} <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>{{report.what}} <textarea name="message" required maxlength="2000" placeholder="{{report.what_hint}}" data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> {{report.left}}</p>
        <label>{{report.email}} <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">{{report.send}}</button><span class="sent"></span></div>
      </form>
      <p class="note">{{report.private}} <a href="privacy.html">{{report.private_link}}</a></p>
    </div>
  </section>
</main>
