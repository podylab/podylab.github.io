<body>
<main class="wrap">
  <div class="page-head">
    <img src="../media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>Segnala un problema</h1><p class="lead">Un errore, un’idea o una domanda. Leggiamo ogni messaggio.</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="Grazie, ricevuto.">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="Di cosa si tratta">
          <label><input type="radio" name="kind" value="bug" checked /><span>Errore</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>Idea</span></label>
          <label><input type="radio" name="kind" value="other" /><span>Altro</span></label>
        </div>
        <div class="row2">
          <label>App <select name="app"><option>PoDee</option><option>PoDoo</option><option>Sito</option></select></label>
          <label>Versione e Windows, se li conosci <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>Cosa è successo <textarea name="message" required maxlength="2000" placeholder="Ad esempio: dopo la sospensione del PC l’isola sparisce e serve riavviare PoDee." data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> caratteri rimasti</p>
        <label>E-mail per la risposta, se vuoi <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">Invia</button><span class="sent"></span></div>
      </form>
      <p class="note">Vediamo solo ciò che scrivi nel modulo. <a href="privacy.html">Privacy</a></p>
    </div>
  </section>
</main>
