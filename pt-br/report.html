<body>
<main class="wrap">
  <div class="page-head">
    <img src="../media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>Relatar um problema</h1><p class="lead">Um erro, uma ideia ou uma pergunta. Lemos todas as mensagens.</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="Obrigado, recebemos.">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="O que aconteceu">
          <label><input type="radio" name="kind" value="bug" checked /><span>Erro</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>Ideia</span></label>
          <label><input type="radio" name="kind" value="other" /><span>Outro</span></label>
        </div>
        <div class="row2">
          <label>App <select name="app"><option>PoDee</option><option>PoDoo</option><option>Site</option></select></label>
          <label>Versão e Windows, se souber <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>O que aconteceu <textarea name="message" required maxlength="2000" placeholder="Por exemplo: depois que o PC sai da suspensão, a ilha some, e só reiniciar o PoDee resolve." data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> caracteres restantes</p>
        <label>E-mail para resposta, se quiser <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">Enviar</button><span class="sent"></span></div>
      </form>
      <p class="note">Só vemos o que você escreve no formulário. <a href="privacy.html">Privacidade</a></p>
    </div>
  </section>
</main>
