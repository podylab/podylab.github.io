<main class="wrap">
  <div class="page-head">
    <img src="../media/podee-icon.svg?v=41ecf9f3" alt="" />
    <div><h1>문제 신고</h1><p class="lead">오류, 아이디어, 질문. 모든 메시지를 읽습니다.</p></div>
  </div>

  <section class="report">
    <div class="card">
      <form data-send="고마워요, 받았어요.">
        <input type="hidden" name="about" value="Report" />
        <div class="kinds" role="radiogroup" aria-label="무슨 일인가요">
          <label><input type="radio" name="kind" value="bug" checked /><span>오류</span></label>
          <label><input type="radio" name="kind" value="idea" /><span>아이디어</span></label>
          <label><input type="radio" name="kind" value="other" /><span>기타</span></label>
        </div>
        <div class="row2">
          <label>앱 <select name="app"><option>PoDee</option><option>PoDoo</option><option>웹사이트</option></select></label>
          <label>버전과 Windows(알고 있다면) <input name="version" placeholder="1.3.9, Windows 11" maxlength="80" /></label>
        </div>
        <label>일어난 일 <textarea name="message" required maxlength="2000" placeholder="예: PC가 절전 모드에서 깨어나면 아일랜드가 사라지고 PoDee를 다시 시작해야 돌아옵니다." data-count></textarea></label>
        <p class="note count" aria-live="polite"><span data-left>2000</span> 자 남음</p>
        <label>답장 받을 이메일(원하면) <input name="email" type="email" autocomplete="email" placeholder="you@mail.com" /></label>
        <div class="btns" style="align-items:center"><button class="btn main" type="submit">보내기</button><span class="sent"></span></div>
      </form>
      <p class="note">우리에게는 양식에 쓴 내용만 보입니다. <a href="privacy.html">개인정보</a></p>
    </div>
  </section>
</main>
